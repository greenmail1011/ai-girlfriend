<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>聊天</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="avatar" id="avatar"></div>
      <div class="who">
        <div class="name" id="name">…</div>
        <div class="status" id="status">在線上</div>
      </div>
      <div class="mood" id="mood" title="心情"></div>
      <button class="icon" id="btnVoice" title="語音回覆">🔈</button>
      <button class="icon" id="btnMenu" title="選單">⋯</button>
    </header>

    <div class="affection" title="好感度"><div id="affBar"></div></div>

    <main class="chat" id="chat"></main>

    <footer class="composer">
      <button class="icon mic" id="btnMic" title="按一下說話">🎙</button>
      <textarea id="input" rows="1" placeholder="輸入訊息…"></textarea>
      <button class="send" id="btnSend" title="送出">➤</button>
    </footer>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <h3>設定</h3>
      <label class="row"><span>通話模式<small>她說完會自動聽你講話</small></span><input type="checkbox" id="optCall"></label>
      <label class="row"><span>主動傳訊息<small>你太久沒說話，她會來找你</small></span><input type="checkbox" id="optProactive" checked></label>
      <label class="row" id="matureRow" hidden><span>成人模式 18+<small>切換到 .env 設定的成人模型</small></span><input type="checkbox" id="optMature"></label>
      <h4>她記得的事</h4>
      <ul class="facts" id="facts"></ul>
      <div class="actions">
        <button id="btnReset" class="danger">清空對話</button>
        <button id="btnClose">關閉</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
