<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小晴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="saas.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/addons/",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="loading" id="loading">她正在準備中…</div>

    <header class="hud">
      <div class="who">
        <div class="name" id="name">小晴</div>
        <div class="sub"><span class="dot"></span><span id="status">在線上</span> · <span id="mood"></span></div>
        <div class="affection" title="好感度"><div id="affBar"></div></div>
      </div>
      <div class="tools">
        <button class="pill" id="btnBalance" title="點數餘額">💎 <span id="balance">–</span></button>
        <button class="icon" id="btnFrame" title="全身 / 半身">⇕</button>
        <button class="icon" id="btnVoice" title="語音">🔈</button>
        <button class="icon" id="btnLog" title="對話紀錄">☰</button>
        <button class="icon" id="btnMenu" title="設定">⚙</button>
      </div>
    </header>

    <div class="subtitle" id="subtitle" aria-live="polite"></div>

    <footer class="composer">
      <button class="icon mic" id="btnMic" title="按一下說話">🎙</button>
      <textarea id="input" rows="1" placeholder="跟她說點什麼…"></textarea>
      <button class="send" id="btnSend" title="送出">➤</button>
    </footer>
  </div>

  <!-- 登入 -->
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <div class="gate-title">小晴</div>
      <p>一個會記得你、會主動找你聊天的她。<br>登入就送試用點數。</p>
      <button class="google" id="btnLogin">使用 Google 登入</button>
      <p class="fine">登入即表示你已滿 18 歲，並同意<a href="terms.html" target="_blank">使用條款</a>與<a href="privacy.html" target="_blank">隱私權政策</a>。</p>
    </div>
  </div>

  <aside class="log" id="log" hidden>
    <div class="log-head"><b>對話紀錄</b><button class="icon" id="btnLogClose">✕</button></div>
    <div class="log-body" id="logBody"></div>
  </aside>

  <!-- 儲值 -->
  <div class="sheet" id="topup" hidden>
    <div class="sheet-card">
      <h3>點數</h3>
      <p class="big">💎 <span id="balance2">–</span> 點</p>
      <p class="hint">聊天和語音會依實際用量扣點，一句話通常不到 1 點。</p>
      <pre class="topup-text" id="topupText"></pre>
      <label class="field"><span>你的會員代碼（儲值時提供）</span><input id="myUid" readonly></label>
      <div class="actions"><button id="btnCopyUid">複製會員代碼</button><button id="btnTopupClose">關閉</button></div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <h3>設定</h3>
      <label class="row"><span>通話模式<small>她說完會自動聽你講話</small></span><input type="checkbox" id="optCall"></label>
      <label class="row"><span>主動找你說話<small>你太久沒說話，她會來找你</small></span><input type="checkbox" id="optProactive" checked></label>
      <label class="row"><span>高品質語音<small>關掉改用免費的瀏覽器語音，比較省點數</small></span><input type="checkbox" id="optHqVoice" checked></label>

      <h4>她記得的事</h4>
      <ul class="facts" id="facts"></ul>

      <div class="actions wrap">
        <a class="btn" id="btnAdmin" href="admin.html" hidden>管理後台</a>
        <button id="btnReset" class="danger">清空對話</button>
        <button id="btnLogout">登出</button>
        <button id="btnClose">關閉</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
