<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>小晴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/addons/",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="loading" id="loading">她正在準備中…</div>

    <header class="hud">
      <div class="who">
        <div class="name" id="name">…</div>
        <div class="sub"><span class="dot"></span><span id="status">在線上</span> · <span id="mood"></span></div>
        <div class="affection" title="好感度"><div id="affBar"></div></div>
      </div>
      <div class="tools">
        <button class="icon" id="btnFrame" title="全身 / 半身">⇕</button>
        <button class="icon" id="btnVoice" title="語音">🔈</button>
        <button class="icon" id="btnLog" title="對話紀錄">☰</button>
        <button class="icon" id="btnMenu" title="設定">⚙</button>
      </div>
    </header>

    <div class="subtitle" id="subtitle" aria-live="polite"></div>

    <footer class="composer">
      <button class="icon mic" id="btnMic" title="按一下說話">🎙</button>
      <textarea id="input" rows="1" placeholder="跟她說點什麼…"></textarea>
      <button class="send" id="btnSend" title="送出">➤</button>
    </footer>
  </div>

  <aside class="log" id="log" hidden>
    <div class="log-head"><b>對話紀錄</b><button class="icon" id="btnLogClose">✕</button></div>
    <div class="log-body" id="logBody"></div>
  </aside>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <h3>設定</h3>

      <label class="row"><span>通話模式<small>她說完會自動聽你講話</small></span><input type="checkbox" id="optCall"></label>
      <label class="row"><span>主動找你說話<small>你太久沒說話，她會來找你</small></span><input type="checkbox" id="optProactive" checked></label>
      <label class="row" id="matureRow" hidden><span>成人模式 18+<small>切換到下方設定的成人模型</small></span><input type="checkbox" id="optMature"></label>

      <details id="modelBox">
        <summary>聊天模型</summary>
        <label class="field"><span>API 網址</span><input id="cfgBase" placeholder="https://openrouter.ai/api/v1"></label>
        <label class="field"><span>API 金鑰</span><input id="cfgKey" type="password" autocomplete="off" placeholder="sk-or-…（留空＝測試模式）"></label>
        <label class="field"><span>模型名稱</span><input id="cfgModel" placeholder="openai/gpt-4o-mini"></label>
        <p class="hint">金鑰只存在這個瀏覽器裡。支援任何 OpenAI 相容 API。</p>
      </details>

      <details id="voiceBox">
        <summary>聲音（ElevenLabs）</summary>
        <label class="field"><span>ElevenLabs API 金鑰</span><input id="cfgElKey" type="password" autocomplete="off" placeholder="留空＝用瀏覽器內建語音"></label>
        <label class="field"><span>聲音 ID（Voice ID）</span><input id="cfgElVoice" placeholder="到 ElevenLabs 的 Voice Library 挑一個，複製它的 ID"></label>
        <label class="field"><span>語音模型</span><input id="cfgElModel" placeholder="eleven_v3"></label>
        <p class="hint">eleven_v3 最自然、會笑會嘆氣；想要反應快一點可以用 eleven_flash_v2_5。</p>
      </details>

      <details id="lookBox">
        <summary>外觀</summary>
        <p class="hint">可以用免費的 <a href="https://vroid.com/studio" target="_blank" rel="noopener">VRoid Studio</a> 捏一個自己的角色，匯出成 .vrm 檔後在這裡上傳。角色必須是成年人，也不要用真實人物的長相。</p>
        <div class="actions">
          <button id="btnVrm">上傳 VRM 模型</button>
          <button id="btnVrmReset">換回預設</button>
        </div>
        <input type="file" id="vrmFile" accept=".vrm" hidden>
      </details>

      <details>
        <summary>成人模式模型（選填）</summary>
        <label class="field"><span>API 網址</span><input id="cfgMBase"></label>
        <label class="field"><span>API 金鑰</span><input id="cfgMKey" type="password" autocomplete="off"></label>
        <label class="field"><span>模型名稱</span><input id="cfgMModel"></label>
        <label class="field"><span>補充人設（自行撰寫）</span><textarea id="cfgMExtra"></textarea></label>
        <p class="hint">需要先上傳你自己的成年角色模型，三格也都填了，上方才會出現開關。請自行確認服務條款允許成人內容。</p>
      </details>

      <div class="actions"><button id="btnSaveCfg" class="primary">儲存設定</button></div>

      <h4>她記得的事</h4>
      <ul class="facts" id="facts"></ul>

      <div class="actions wrap">
        <button id="btnExport">匯出記憶</button>
        <button id="btnImport">匯入記憶</button>
        <button id="btnReset" class="danger">清空對話</button>
        <button id="btnClose">關閉</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>

  <script src="persona.js?v=3"></script>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
